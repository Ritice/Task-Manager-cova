version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: taskmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskmanager
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: taskmanager-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: taskmanager
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: MzY0NmU5NmYzNzk0OWJmZWVlYzM1NmY5NzY5NjVmNzM4NGFlOWQ2NDU3ZGYxYWJlMzc5MzE3ZjZlMTQzZWUxNDU=
      JWT_EXPIRATION: 86400000
    ports:
      - "8081:8081"

volumes:
  mysql_data:
