server:
  port: 8081

spring:
  application:
    name: task-manager-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskmanager}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:MzY0NmU5NmYzNzk0OWJmZWVlYzM1NmY5NzY5NjVmNzM4NGFlOWQ2NDU3ZGYxYWJlMzc5MzE3ZjZlMTQzZWUxNDU=}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.springframework.security: INFO
